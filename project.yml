name: SecondClock
options:
  bundleIdPrefix: com.irochi
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0.0"
    DEVELOPMENT_TEAM: XX3ULK22EF
targets:
  SecondClock:
    type: application
    platform: iOS
    sources:
      - path: SecondClock
      - path: Shared
    resources:
      - path: SecondClock/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.irochi.SecondClock
        CODE_SIGN_ENTITLEMENTS: SecondClock/SecondClock.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SecondClock
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: SecondClockWidgetExtension
        embed: true
  SecondClockWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: SecondClockWidget
      - path: Shared
    info:
      path: SecondClockWidget/Info.plist
      properties:
        CFBundleDisplayName: SecondClock
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.irochi.SecondClock.Widget
        CODE_SIGN_ENTITLEMENTS: SecondClockWidget/SecondClockWidget.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
  SecondClockTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SecondClockTests
    dependencies:
      - target: SecondClock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.irochi.SecondClockTests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  SecondClock:
    build:
      targets:
        SecondClock: all
        SecondClockTests:
          - test
    run:
      config: Debug
      storeKitConfiguration: SecondClock/SecondClock.storekit
    test:
      config: Debug
      targets:
        - name: SecondClockTests
          parallelizable: false
