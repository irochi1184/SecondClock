name: SecondClock
options:
  bundleIdPrefix: com.irochi
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0.0"
targets:
  SecondClock:
    type: application
    platform: iOS
    sources:
      - path: SecondClock
      - path: Shared
    resources:
      - path: SecondClock/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.irochi.SecondClock
        CODE_SIGN_ENTITLEMENTS: SecondClock/SecondClock.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SecondClock
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: SecondClockWidgetExtension
        embed: true
  SecondClockWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: SecondClockWidget
      - path: Shared
    info:
      path: SecondClockWidget/Info.plist
      properties:
        CFBundleDisplayName: SecondClock
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.irochi.SecondClock.Widget
        CODE_SIGN_ENTITLEMENTS: SecondClockWidget/SecondClockWidget.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
